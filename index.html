<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#121216">
  <title>Leitor PDF + OCR</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #1e1e24;
      --bar: #121216;
      --text: #f0f0f5;
      --accent: #4f46e5;
      --surface: #272732;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header, footer {
      background: var(--bar);
      padding: 8px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
      flex-wrap: wrap;
    }
    body.immersive-reading header,
    body.immersive-reading footer {
      display: none;
    }
    .toolbar-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      background: #2a2a35;
      color: var(--text);
      border: 1px solid #3f3f4e;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.active { background: #dc2626; border-color: #ef4444; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    input[type="file"] { display: none; }

    #search-bar {
      background: var(--surface);
      padding: 8px 12px;
      display: none;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #3f3f4e;
      z-index: 9;
    }
    #search-input {
      flex: 1;
      background: #16161d;
      color: var(--text);
      border: 1px solid #3f3f4e;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      min-width: 100px;
    }
    #search-status {
      font-size: 12px;
      color: #a5b4fc;
      min-width: 48px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #viewer-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }

    #page-wrapper {
      position: relative;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-radius: 4px;
      overflow: hidden;
    }

    canvas {
      display: block;
      transition: filter 0.2s ease;
    }

    .night-mode {
      filter: invert(0.92) hue-rotate(180deg);
    }

    .textLayer ::selection {
      background: rgba(79, 70, 229, 0.35);
    }

    .search-highlight {
      background: rgba(250, 204, 21, 0.45);
      border-radius: 2px;
    }

    #page-info {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: #2a2a35;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3f3f4e;
      cursor: pointer;
      user-select: none;
    }
    #page-info:active { transform: scale(0.96); }

    .empty-state {
      margin: auto;
      text-align: center;
      opacity: 0.6;
      padding: 24px;
      line-height: 1.6;
    }

    #ocr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid #3f3f4e;
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
    }
    #ocr-status {
      font-size: 13px;
      color: #a5b4fc;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #181820;
      border-radius: 4px;
      overflow: hidden;
    }
    #ocr-progress {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    #ocr-textarea {
      width: 100%;
      height: 260px;
      background: #16161d;
      color: var(--text);
      border: 1px solid #3f3f4e;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <label class="btn primary" id="open-label">
        📂 Abrir
        <input type="file" id="file-input" accept="application/pdf">
      </label>
      <button class="btn" id="tts-btn" disabled title="Ler página em voz alta">
        🔊 Ouvir
      </button>
      <button class="btn" id="share-btn" disabled title="Compartilhar PDF">
        📤 Share
      </button>
      <button class="btn" id="ocr-btn" disabled title="Extrair texto via OCR">
        📄 OCR
      </button>
    </div>
    <div class="toolbar-group">
      <button class="btn" id="search-toggle" disabled title="Buscar texto no PDF">🔍</button>
      <button class="btn" id="zoom-out">A-</button>
      <button class="btn" id="zoom-in">A+</button>
      <button class="btn" id="night-toggle" title="Modo Noturno">🌙</button>
      <button class="btn" id="fullscreen-toggle" title="Tela Cheia">⛶</button>
    </div>
  </header>

  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Buscar palavra no documento...">
    <span id="search-status">0/0</span>
    <button class="btn" id="search-prev" title="Ocorrência anterior">▲</button>
    <button class="btn" id="search-next" title="Próxima ocorrência">▼</button>
    <button class="btn" id="search-close" title="Fechar busca">✕</button>
  </div>

  <main id="viewer-container">
    <div id="empty-msg" class="empty-state">
      Toque em <b>📂 Abrir</b> para carregar seu PDF.<br><br>
      <small>💡 Gire o celular para modo paisagem a qualquer momento ou toque em <b>🔊 Ouvir</b> para escutar o documento.</small>
    </div>

    <div id="page-wrapper">
      <canvas id="pdf-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
    </div>
  </main>

  <div id="ocr-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📄 Texto Extraído da Página (OCR)</span>
        <button class="btn" id="close-ocr">✕</button>
      </div>
      <div id="ocr-status">Preparando leitor óptico...</div>
      <div class="progress-bar">
        <div id="ocr-progress"></div>
      </div>
      <textarea id="ocr-textarea" placeholder="O texto reconhecido aparecerá aqui..."></textarea>
      <div class="modal-actions">
        <button class="btn primary" id="copy-ocr">📋 Copiar Texto</button>
        <button class="btn" id="share-ocr">✉️ Compartilhar Texto</button>
      </div>
    </div>
  </div>

  <footer>
    <button class="btn" id="prev-page">◀ Anterior</button>
    <span id="page-info" title="Toque para ir direto a uma página">0 / 0</span>
    <button class="btn" id="next-page">Próxima ▶</button>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageRendering = false,
        pageNumPending = null,
        scale = 1.2,
        baseScale = 1.2,
        currentFile = null,
        currentFileName = '',
        wakeLock = null,
        searchMatches = [],
        currentMatchIdx = -1,
        activeSearchQuery = '',
        isSpeaking = false;

    const viewerContainer = document.getElementById('viewer-container'),
          pageWrapper = document.getElementById('page-wrapper'),
          canvas = document.getElementById('pdf-canvas'),
          textLayerDiv = document.getElementById('text-layer'),
          ctx = canvas.getContext('2d'),
          pageInfo = document.getElementById('page-info'),
          emptyMsg = document.getElementById('empty-msg'),
          ttsBtn = document.getElementById('tts-btn'),
          shareBtn = document.getElementById('share-btn'),
          ocrBtn = document.getElementById('ocr-btn'),
          searchToggleBtn = document.getElementById('search-toggle'),
          fullscreenBtn = document.getElementById('fullscreen-toggle'),
          searchBar = document.getElementById('search-bar'),
          searchInput = document.getElementById('search-input'),
          searchStatus = document.getElementById('search-status'),
          ocrModal = document.getElementById('ocr-modal'),
          ocrStatus = document.getElementById('ocr-status'),
          ocrProgress = document.getElementById('ocr-progress'),
          ocrTextarea = document.getElementById('ocr-textarea');

    // ==========================================
    // TEXT-TO-SPEECH (Leitura em Voz Alta)
    // ==========================================
    function stopSpeaking() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      ttsBtn.classList.remove('active');
      ttsBtn.textContent = '🔊 Ouvir';
    }

    async function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        alert('Seu dispositivo não suporta síntese de voz nativa.');
        return;
      }

      if (isSpeaking) {
        stopSpeaking();
        return;
      }

      if (!pdfDoc) return;

      ttsBtn.textContent = '⏳ Carregando...';

      // 1. Tenta extrair o texto nativo da página
      const page = await pdfDoc.getPage(pageNum);
      const textContent = await page.getTextContent();
      let text = textContent.items.map(item => item.str).join(' ').trim();

      // 2. Se a página for uma imagem escaneada sem texto, avisa e sugere o OCR
      if (!text || text.length < 5) {
        ttsBtn.textContent = '🔊 Ouvir';
        if (confirm('Esta página não possui texto digitalizado. Deseja executar o OCR primeiro para ler a imagem?')) {
          ocrBtn.click();
        }
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;

      utterance.onstart = () => {
        isSpeaking = true;
        ttsBtn.classList.add('active');
        ttsBtn.textContent = '⏹️ Parar';
      };

      utterance.onend = () => {
        stopSpeaking();
      };

      utterance.onerror = () => {
        stopSpeaking();
      };

      window.speechSynthesis.speak(utterance);
    }

    ttsBtn.addEventListener('click', toggleSpeech);

    // ==========================================
    // ROTAÇÃO INTELIGENTE DA TELA (Redimensionamento)
    // ==========================================
    let resizeTimeout = null;
    function handleAutoFit() {
      if (!pdfDoc) return;
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(async () => {
        const page = await pdfDoc.getPage(pageNum);
        const unscaledViewport = page.getViewport({ scale: 1 });
        const containerWidth = viewerContainer.clientWidth - 20;

        // Ajusta a escala para preencher a largura da tela mantendo proporção
        scale = Math.max(0.6, Math.min(containerWidth / unscaledViewport.width, 3.0));
        baseScale = scale;
        renderPage(pageNum);
      }, 150);
    }

    window.addEventListener('resize', handleAutoFit);
    window.addEventListener('orientationchange', handleAutoFit);

    // ==========================================
    // TELA CHEIA E WAKE LOCK
    // ==========================================
    function enterFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      }
    }

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        enterFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });

// Para iniciar o app em modo de tela cheia
/*
    document.getElementById('open-label').addEventListener('click', () => {
      enterFullscreen();
    });
*/
    let lastTap = 0;
    viewerContainer.addEventListener('touchend', e => {
      if (!pdfDoc || e.changedTouches.length !== 1) return;
      const now = Date.now();
      if (now - lastTap < 300) {
        document.body.classList.toggle('immersive-reading');
        enterFullscreen();
      }
      lastTap = now;
    }, { passive: true });

    async function requestWakeLock() {
      if ('wakeLock' in navigator && pdfDoc) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && pdfDoc) {
        requestWakeLock();
      }
    });

    // ==========================================
    // RENDERIZAÇÃO E BUSCA
    // ==========================================
    function highlightSearchInLayer() {
      if (!activeSearchQuery) return;
      const spans = textLayerDiv.querySelectorAll('span');
      const q = activeSearchQuery.toLowerCase();
      spans.forEach(span => {
        if (span.textContent.toLowerCase().includes(q)) {
          span.classList.add('search-highlight');
        }
      });
    }

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(page => {
        const outputScale = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale });

        canvas.style.width = `${ Math.floor(viewport.width) }px`;
        canvas.style.height = `${ Math.floor(viewport.height) }px`;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        pageWrapper.style.width = `${ Math.floor(viewport.width) }px`;
        pageWrapper.style.height = `${ Math.floor(viewport.height) }px`;
        pageWrapper.style.setProperty('--scale-factor', scale);

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
        const renderContext = { canvasContext: ctx, transform, viewport };

        const renderTask = page.render(renderContext);

        textLayerDiv.innerHTML = '';
        const textTask = page.getTextContent().then(textContent => {
          return pdfjsLib.renderTextLayer({
            textContentSource: textContent,
            container: textLayerDiv,
            viewport: viewport,
            textDivs: []
          }).promise;
        });

        Promise.all([renderTask.promise, textTask]).then(() => {
          pageRendering = false;
          highlightSearchInLayer();
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      pageInfo.textContent = `${num} / ${pdfDoc.numPages}`;
      if (currentFileName) {
        localStorage.setItem(`pdf_page_${currentFileName}`, num);
      }
    }

    function queueRenderPage(num) {
      stopSpeaking(); // Para a leitura em voz alta se o usuário virar de página
      if (pageRendering) pageNumPending = num;
      else renderPage(num);
    }

    function goPrevPage() {
      if (!pdfDoc || pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
      viewerContainer.scrollTop = 0;
    }

    function goNextPage() {
      if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
      viewerContainer.scrollTop = 0;
    }

    document.getElementById('prev-page').addEventListener('click', goPrevPage);
    document.getElementById('next-page').addEventListener('click', goNextPage);

    pageInfo.addEventListener('click', () => {
      if (!pdfDoc) return;
      const input = prompt(`Digite o número da página (1 a ${pdfDoc.numPages}):`, pageNum);
      if (input === null) return;
      const targetPage = parseInt(input.trim(), 10);
      if (!isNaN(targetPage) && targetPage >= 1 && targetPage <= pdfDoc.numPages) {
        pageNum = targetPage;
        queueRenderPage(pageNum);
        viewerContainer.scrollTop = 0;
      }
    });

    let touchStartX = 0,
        touchStartY = 0;

    viewerContainer.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    viewerContainer.addEventListener('touchend', e => {
      if (!pdfDoc || e.changedTouches.length !== 1) return;
      if (scale > baseScale * 1.15) return;
      const selection = window.getSelection();
      if (selection && selection.toString().length > 0) return;

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        if (dx < 0) goNextPage();
        else goPrevPage();
      }
    }, { passive: true });

    function toggleSearchBar() {
      if (!pdfDoc) return;
      const isVisible = searchBar.style.display === 'flex';
      if (isVisible) {
        searchBar.style.display = 'none';
        activeSearchQuery = '';
        queueRenderPage(pageNum);
      } else {
        searchBar.style.display = 'flex';
        searchInput.focus();
        searchInput.select();
      }
    }

    searchToggleBtn.addEventListener('click', toggleSearchBar);
    document.getElementById('search-close').addEventListener('click', toggleSearchBar);

    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        if (pdfDoc) {
          e.preventDefault();
          searchBar.style.display = 'flex';
          searchInput.focus();
          searchInput.select();
        }
      }
    });

    async function performSearch(query) {
      query = query.trim().toLowerCase();
      activeSearchQuery = query;
      searchMatches = [];
      currentMatchIdx = -1;

      if (!query || !pdfDoc) {
        searchStatus.textContent = '0/0';
        queueRenderPage(pageNum);
        return;
      }

      searchStatus.textContent = '...';
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ').toLowerCase();
        if (pageText.includes(query)) {
          searchMatches.push(i);
        }
      }

      if (searchMatches.length > 0) {
        const nextIdx = searchMatches.findIndex(p => p >= pageNum);
        currentMatchIdx = nextIdx !== -1 ? nextIdx : 0;
        pageNum = searchMatches[currentMatchIdx];
        searchStatus.textContent = `${currentMatchIdx + 1}/${searchMatches.length}`;
        queueRenderPage(pageNum);
      } else {
        searchStatus.textContent = '0/0';
        queueRenderPage(pageNum);
      }
    }

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (activeSearchQuery === searchInput.value.trim().toLowerCase() && searchMatches.length > 0) {
          document.getElementById('search-next').click();
        } else {
          performSearch(searchInput.value);
        }
      }
    });

    searchInput.addEventListener('change', () => performSearch(searchInput.value));

    document.getElementById('search-next').addEventListener('click', () => {
      if (searchInput.value.trim().toLowerCase() !== activeSearchQuery) {
        performSearch(searchInput.value);
        return;
      }
      if (!searchMatches.length) return;
      currentMatchIdx = (currentMatchIdx + 1) % searchMatches.length;
      pageNum = searchMatches[currentMatchIdx];
      searchStatus.textContent = `${currentMatchIdx + 1}/${searchMatches.length}`;
      queueRenderPage(pageNum);
    });

    document.getElementById('search-prev').addEventListener('click', () => {
      if (!searchMatches.length) return;
      currentMatchIdx = (currentMatchIdx - 1 + searchMatches.length) % searchMatches.length;
      pageNum = searchMatches[currentMatchIdx];
      searchStatus.textContent = `${currentMatchIdx + 1}/${searchMatches.length}`;
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      if (!pdfDoc) return;
      scale = Math.min(scale + 0.25, 3.5);
      queueRenderPage(pageNum);
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
      if (!pdfDoc) return;
      scale = Math.max(scale - 0.25, 0.5);
      queueRenderPage(pageNum);
    });

    document.getElementById('night-toggle').addEventListener('click', () => {
      canvas.classList.toggle('night-mode');
    });

    shareBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      const shareData = {
        title: currentFileName,
        text: `Segue em anexo o documento: ${currentFileName} (Página ${pageNum})`,
        files: [currentFile]
      };

      if (navigator.canShare && navigator.canShare({ files: [currentFile] })) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const subject = encodeURIComponent(`Documento PDF: ${currentFileName}`);
      const body = encodeURIComponent(`Olá,\n\nCompartilho informações do documento "${currentFileName}" (Página ${pageNum}).`);
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    ocrBtn.addEventListener('click', async () => {
      if (!pdfDoc) return;
      ocrModal.style.display = 'flex';
      ocrTextarea.value = '';
      ocrProgress.style.width = '5%';
      ocrStatus.textContent = 'Iniciando motor OCR em Português...';

      try {
        const result = await Tesseract.recognize(
          canvas,
          'por',
          {
            logger: m => {
              if (m.status === 'recognizing text') {
                const pct = Math.round(m.progress * 100);
                ocrProgress.style.width = `${pct}%`;
                ocrStatus.textContent = `Lendo página ${pageNum}... (${pct}%)`;
              } else {
                ocrStatus.textContent = `Processando: ${m.status}...`;
              }
            }
          }
        );

        const extractedText = result.data.text.trim();
        ocrTextarea.value = extractedText || 'Nenhum texto legível foi encontrado nesta página.';
        ocrProgress.style.width = '100%';
        ocrStatus.textContent = `Leitura concluída! Você pode revisar ou copiar o texto abaixo.`;
      } catch (err) {
        ocrStatus.textContent = 'Erro ao executar o OCR. Verifique sua conexão na primeira execução.';
        ocrTextarea.value = err.message;
      }
    });

    document.getElementById('close-ocr').addEventListener('click', () => {
      ocrModal.style.display = 'none';
    });

    document.getElementById('copy-ocr').addEventListener('click', async () => {
      if (!ocrTextarea.value) return;
      ocrTextarea.select();
      await navigator.clipboard.writeText(ocrTextarea.value);
      ocrStatus.textContent = '✅ Texto copiado para a área de transferência!';
    });

    document.getElementById('share-ocr').addEventListener('click', async () => {
      const text = ocrTextarea.value.trim();
      if (!text) return;

      if (navigator.share) {
        try {
          await navigator.share({
            title: `Texto da página ${pageNum} - ${currentFileName}`,
            text: text
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      const subject = encodeURIComponent(`Trecho extraído: ${currentFileName} (Pág. ${pageNum})`);
      const body = encodeURIComponent(text);
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    });

    function loadPdfFile(file) {
      if (!file) return;
      currentFile = file;
      currentFileName = file.name;
      ttsBtn.disabled = false;
      shareBtn.disabled = false;
      ocrBtn.disabled = false;
      searchToggleBtn.disabled = false;

      const fileReader = new FileReader();
      fileReader.onload = function() {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
          pdfDoc = pdf;
          emptyMsg.style.display = 'none';
          pageWrapper.style.display = 'block';

          requestWakeLock();

          pdf.getPage(1).then(firstPage => {
            const unscaledViewport = firstPage.getViewport({ scale: 1 });
            const containerWidth = viewerContainer.clientWidth - 20;
            scale = Math.max(0.6, Math.min(containerWidth / unscaledViewport.width, 2.0));
            baseScale = scale;

            const savedPage = parseInt(localStorage.getItem(`pdf_page_${currentFileName}`), 10);
            pageNum = (savedPage && savedPage <= pdf.numPages) ? savedPage : 1;
            renderPage(pageNum);
          });
        });
      };
      fileReader.readAsArrayBuffer(file);
    }

    document.getElementById('file-input').addEventListener('change', e => {loadPdfFile(e.target.files[0]);
    });


    // Abre o arquivo PDF tanto via função direta quanto injetando no botão #file-input
	    function abrirArquivoRecebido(file) {
	      if (!file) return;

	      if (typeof loadPdfFile === 'function') {
	        loadPdfFile(file);
	        return;
	      }

	      const fileInput = document.getElementById('file-input');
	      if (fileInput) {
	        const dt = new DataTransfer();
	        dt.items.add(file);
	        fileInput.files = dt.files;
	        fileInput.dispatchEvent(new Event('change', { bubbles: true }));
	      }
	    }

// Verifica na memória se o Android enviou um PDF via "Share / Compartilhar"
    let verificandoShare = false;
    async function checkAndroidSharedPdf() {
      if (verificandoShare || !('caches' in window)) return;
      verificandoShare = true;

      try {
        const SHARED_PDF_KEY = 'https://shared-pdf.local/documento.pdf';
        const SHARED_STATUS_KEY = 'https://shared-pdf.local/status.json';
        const cache = await caches.open('leitor-pdf-v3');

        const response = await cache.match(SHARED_PDF_KEY);
        const statusResp = await cache.match(SHARED_STATUS_KEY);

        if (response) {
          emptyMsg.innerHTML = '⏳ <b>Carregando PDF compartilhado...</b>';
          const blob = await response.blob();
          const rawName = response.headers.get('X-File-Name');
          const fileName = rawName ? decodeURIComponent(rawName) : 'documento.pdf';
          const file = new File([blob], fileName, { type: 'application/pdf' });

          await cache.delete(SHARED_PDF_KEY);
          await cache.delete(SHARED_STATUS_KEY);

          if (window.location.search.includes('load-shared')) {
            window.history.replaceState({}, document.title, './index.html');
          }

          loadPdfFile(file);
        } else if (statusResp) {
          const statusData = await statusResp.json();
          await cache.delete(SHARED_STATUS_KEY);
          if (!statusData.ok) {
            alert('Aviso de Diagnóstico do Share: ' + statusData.reason);
          }
        }
      } catch (err) {
        console.error('Falha ao recuperar PDF compartilhado:', err);
      } finally {
        verificandoShare = false;
      }
    }

  </script>
